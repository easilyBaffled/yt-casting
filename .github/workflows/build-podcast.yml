name: Convert YouTube to MP3 and update feed

on:
  push:
    branches: [gh-pages]
permissions:
  contents: write
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    # install dependencies (rss package for feed generation and any dependencies
    # your conversion script needs, e.g. youtube-dl or yt-dlp)
    - run: npm install rss youtubei.js cookiefile
    - run: pip install yt-dlp
    - run: sudo apt-get update && sudo apt-get install -y ffmpeg

    # - name: Write cookies.txt from secret
    #   run: |
    #     echo "Length: ${#YT_COOKIES}, ${#YT_COOKIES_RAW}" # Debugging output
    #     echo "${{ secrets.YT_COOKIES }}" > cookies.txt
    #   env:
    #     YT_COOKIES: ${{ secrets.YT_COOKIES }}
    #     YT_COOKIES_RAW: ${{ secrets.YT_COOKIES_RAW }}

    - name: Convert new YouTube videos to MP3
      run: |
        set -e
        node scripts/convert-and-feed.js
      env:
        YT_COOKIES: ${{ secrets.YT_COOKIES }}
        YT_COOKIES_RAW: ${{ secrets.YT_COOKIES_RAW }}

    - name: Commit and push
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git diff
        git add static feed.xml youtube_urls.json
        git commit -m "Add new episode(s) and update feed"
        git push
